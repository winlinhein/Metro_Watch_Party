# socketio-proxy.conf
#
# Proxies all /socket.io/ traffic (both HTTP long-polling and WebSocket upgrade)
# to the Node.js signaling server running on localhost:3000 inside the same
# Docker container.
#
# This lets the browser connect to  wss://your-render-app.onrender.com/socket.io/
# instead of needing a separate :3000 port — which Render does not expose.

<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On

    # WebSocket upgrade path — must come BEFORE the plain HTTP proxy rule
    <IfModule mod_proxy_wstunnel.c>
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/socket\.io/(.*)$ ws://localhost:3000/socket.io/$1 [P,L]
    </IfModule>

    # HTTP long-polling fallback path
    ProxyPass        /socket.io http://localhost:3000/socket.io
    ProxyPassReverse /socket.io http://localhost:3000/socket.io
</IfModule>
